name: VeriFast Challenge 7

# The Challenge 7 proof needs a patched VeriFast 26.10 (see
# verifast-proofs/core/sync/atomic.rs/verifast-upstream.md). Once a VeriFast
# release includes the patch, verify.sh moves to check-verifast-proofs.sh and
# this workflow can be removed.

on:
  workflow_dispatch:
    inputs:
      supplementary:
        description: Also replay the supplementary evidence (about 30 minutes)
        type: boolean
        default: false
  merge_group:
  pull_request:
    branches: [main]
    paths:
      - 'library/core/**'
      - 'rust-toolchain.toml'
      - 'verifast-proofs/core/sync/atomic.rs/**'
      - '.github/workflows/verifast-challenge-7.yml'
  push:
    paths:
      - 'library/core/**'
      - 'rust-toolchain.toml'
      - 'verifast-proofs/core/sync/atomic.rs/**'
      - '.github/workflows/verifast-challenge-7.yml'

permissions:
  contents: read

env:
  PROOF: verifast-proofs/core/sync/atomic.rs
  VERIFIER_NIGHTLY: nightly-2026-09-25

jobs:
  module-proof:
    name: Verify core::sync::atomic
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the verifier toolchain
        run: rustup toolchain install "$VERIFIER_NIGHTLY" --profile minimal --component rustc-dev,rust-src --target aarch64-unknown-linux-gnu

      - name: Build the patched VeriFast
        run: bash "$PROOF/build-verifast.sh" "$RUNNER_TEMP/verifast"

      - name: Verify, refinement-check and diff the module
        run: |
          bin="$RUNNER_TEMP/verifast/verifast-26.10/bin"
          export PATH="$bin:$PATH" LD_LIBRARY_PATH="$bin:$RUNNER_TEMP/verifast/vfdeps-adf88dc/lib"
          export RUSTUP_TOOLCHAIN="$VERIFIER_NIGHTLY"
          bash "$PROOF/verify.sh"
          python3 "$PROOF/check-module.py"

  supplementary:
    name: Replay supplementary evidence
    if: github.event_name == 'workflow_dispatch' && inputs.supplementary
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install the verifier and source toolchains
        run: |
          rustup toolchain install "$VERIFIER_NIGHTLY" --profile minimal --component rustc-dev,rust-src --target aarch64-unknown-linux-gnu
          source_nightly=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          rustup toolchain install "$source_nightly" --profile minimal --component rust-src,miri --target aarch64-unknown-linux-gnu

      - name: Replay the supplementary proofs and clients
        run: bash "$PROOF/supplementary/replay-challenge-7.sh" "$RUNNER_TEMP/challenge-7"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: challenge-7-evidence
          path: ${{ runner.temp }}/challenge-7/evidence
          if-no-files-found: warn
